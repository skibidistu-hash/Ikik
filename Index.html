<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>АРТУР ГЕЙМ — демо-казино</title>
<style>
  :root{
    --vh: 1vh;
    --bg-0:#0a0705;
    --bg-1:#120c08;
    --bg-2:#1a120b;
    --panel: rgba(28,18,11,0.55);
    --panel-brd: rgba(255,140,40,0.18);
    --ember-1:#ff7a1a;
    --ember-2:#ffb020;
    --ember-3:#ff3d1a;
    --safe:#3fb96a;
    --danger:#ff3b3b;
    --text-0:#fbe9d6;
    --text-1:#c9ab8c;
    font-size: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background: radial-gradient(120% 90% at 50% -10%, #241609 0%, var(--bg-0) 55%, #050302 100%);
    color:var(--text-0);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #app{ position:relative; width:100%; height: calc(var(--vh) * 100); max-width:520px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; }

  .ember-glow{ position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(280px 220px at 15% 8%, rgba(255,122,26,0.14), transparent 60%),
      radial-gradient(320px 260px at 90% 15%, rgba(255,61,26,0.10), transparent 65%); }

  #topbar{ position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:0.2px; font-size:1.05rem; }
  .brand .flame{ font-size:1.25rem; filter:drop-shadow(0 0 8px rgba(255,122,26,0.8)); }
  .balance{ display:flex; align-items:center; gap:8px; background: var(--panel); border:1px solid var(--panel-brd);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius:16px; padding:8px 14px; box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 6px 18px rgba(0,0,0,0.35); }
  .balance .coin{ filter:drop-shadow(0 0 6px rgba(255,176,32,0.7)); }
  .balance b{ font-variant-numeric: tabular-nums; font-size:1.02rem; transition: color .25s; }
  .balance b.pulse-up{ color:var(--safe); }
  .balance b.pulse-down{ color:var(--danger); }

  #ticker{ position:relative; z-index:5; margin:0 16px 6px; height:30px; overflow:hidden;
    background: var(--panel); border:1px solid var(--panel-brd); border-radius:12px; backdrop-filter: blur(10px); flex-shrink:0; }
  #ticker-track{ position:absolute; white-space:nowrap; will-change:transform; padding-left:100%; animation: scrollL 22s linear infinite; display:flex; align-items:center; height:100%; }
  @keyframes scrollL{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  .tick-item{ display:inline-flex; align-items:center; gap:6px; padding:0 18px; font-size:0.8rem; color:var(--text-1); }
  .tick-item b{ color:var(--text-0); font-weight:600; }
  .tick-item .win{ color:var(--safe); font-weight:700; }
  .tick-item .loss{ color:var(--danger); font-weight:700; }

  #stage{ position:relative; z-index:2; flex:1; overflow:hidden; min-height:0; }
  #viewport{ display:flex; width:400%; height:100%; transition: transform .38s cubic-bezier(.22,.61,.36,1); }
  .view{ width:25%; height:100%; overflow-y:auto; overflow-x:hidden; padding:6px 16px 20px; -ms-overflow-style:none; scrollbar-width:none; }
  .view::-webkit-scrollbar{ display:none; }

  .card{ background: var(--panel); border:1px solid var(--panel-brd); border-radius:20px;
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 10px 30px rgba(0,0,0,0.4); padding:16px; }
  h2.mode-title{ font-size:1.15rem; margin:6px 2px 12px; display:flex; align-items:center; gap:8px; font-weight:700;}
  h2.mode-title .sub{ font-size:0.75rem; color:var(--text-1); font-weight:400; }

  .btn{ border:none; border-radius:14px; padding:13px 18px; font-size:0.95rem; font-weight:700; cursor:pointer;
    color:#1a0d02; background: linear-gradient(160deg, var(--ember-2), var(--ember-1));
    box-shadow: 0 6px 20px rgba(255,122,26,0.35), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s; font-family:inherit; }
  .btn:active{ transform: scale(0.96); filter:brightness(0.95); }
  .btn.ghost{ background:rgba(255,255,255,0.06); color:var(--text-0); box-shadow:none; border:1px solid var(--panel-brd); }
  .btn:disabled{ opacity:0.4; filter:grayscale(0.4); transform:none; cursor:default; }

  .row{ display:flex; gap:10px; align-items:center; }
  .row.wrap{ flex-wrap:wrap; }
  .grow{ flex:1; }

  .bet-input{ background:rgba(0,0,0,0.35); border:1px solid var(--panel-brd); border-radius:14px;
    color:var(--text-0); padding:12px 14px; font-size:1rem; font-weight:700; width:100%; font-variant-numeric: tabular-nums; font-family:inherit; }
  .bet-input:focus{ outline:none; border-color:var(--ember-1); }
  .stepper{ display:flex; gap:6px; }
  .stepper button{ background:rgba(255,255,255,0.06); border:1px solid var(--panel-brd); color:var(--text-0); border-radius:10px; padding:8px 12px; font-weight:700; font-family:inherit; }

  /* ===================== CRASH ===================== */
  .crash-sky{ position:relative; height:270px; border-radius:18px; overflow:hidden; margin-bottom:14px;
    background: linear-gradient(180deg, #1b0f06 0%, #0c0805 70%, #050302 100%); border:1px solid var(--panel-brd); }
  .stars-bg{ position:absolute; inset:-20px; opacity:0.5; background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #ffe9c8, transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, #ffe9c8, transparent),
      radial-gradient(1px 1px at 50% 60%, #ffcf9a, transparent),
      radial-gradient(1.5px 1.5px at 85% 70%, #ffe9c8, transparent),
      radial-gradient(1px 1px at 30% 80%, #ffcf9a, transparent),
      radial-gradient(1.5px 1.5px at 10% 65%, #ffe9c8, transparent); }
  .crash-mult{ position:absolute; top:14px; left:0; right:0; text-align:center; z-index:4;
    font-size:2.4rem; font-weight:800; font-variant-numeric: tabular-nums; text-shadow:0 0 20px rgba(255,122,26,0.6); transition: color .15s; }
  .crash-mult.busted{ color:var(--danger); text-shadow:0 0 24px rgba(255,60,26,0.8); }
  .crash-status{ position:absolute; top:64px; left:0; right:0; text-align:center; z-index:4; font-size:0.8rem; color:var(--text-1); letter-spacing:0.5px;}
  .rocket-wrap{ position:absolute; left:10%; bottom:8%; width:70px; height:70px; transform-origin:50% 60%; z-index:3; }
  .trail{ position:absolute; left:50%; bottom:6px; width:7px; height:0; background:linear-gradient(180deg, rgba(255,176,32,0.9), rgba(255,60,26,0)); border-radius:6px; transform:translateX(-50%); filter:blur(1px); }
  .flame{ position:absolute; left:50%; bottom:0px; width:16px; height:16px; transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle, #fff6d0 0%, #ffb020 40%, #ff5b1a 70%, transparent 75%); filter:blur(1.5px); animation: flick .12s infinite alternate; }
  @keyframes flick{ from{ transform:translateX(-50%) scale(1); } to{ transform:translateX(-50%) scale(0.72) translateY(2px); } }
  .rocket-svg{ position:relative; z-index:2; width:100%; height:100%; filter: drop-shadow(0 0 10px rgba(255,150,40,0.55)); }
  .explosion{ position:absolute; width:120px; height:120px; left:50%; top:50%; transform:translate(-50%,-50%) scale(0); border-radius:50%;
    background: radial-gradient(circle, #fff6d0 0%, #ffb020 25%, #ff5b1a 50%, transparent 70%); opacity:0; pointer-events:none; z-index:5; }
  .explosion.go{ animation: boom .55s ease-out forwards; }
  @keyframes boom{ 0%{ transform:translate(-50%,-50%) scale(0.2); opacity:1;} 70%{opacity:0.9;} 100%{ transform:translate(-50%,-50%) scale(2.4); opacity:0;} }

  .cashout-btn{ width:100%; font-size:1.05rem; padding:16px; position:relative; overflow:hidden; }
  .cashout-btn .cash-amt{ display:block; font-size:0.78rem; font-weight:600; opacity:0.85; margin-top:2px;}

  /* ===================== MINES ===================== */
  .mines-grid{ display:grid; gap:8px; margin:14px 0; }
  .mine-cell{ aspect-ratio:1/1; border-radius:14px; border:1px solid var(--panel-brd);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.25));
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; position:relative; cursor:pointer; transition: transform .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.02) inset; }
  .mine-cell:active{ transform:scale(0.93); }
  .mine-cell.revealed-safe{ background: linear-gradient(160deg, rgba(63,185,106,0.25), rgba(63,185,106,0.05)); border-color: rgba(63,185,106,0.5); animation: pop .32s ease; }
  .mine-cell.revealed-bomb{ background: linear-gradient(160deg, rgba(255,59,59,0.35), rgba(255,59,59,0.08)); border-color: rgba(255,59,59,0.6); animation: shake .4s ease; }
  .mine-cell.locked{ pointer-events:none; }
  @keyframes pop{ 0%{ transform:scale(0.6) rotate(-8deg); opacity:0;} 60%{ transform:scale(1.12);} 100%{ transform:scale(1); opacity:1;} }
  @keyframes shake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,0);} 40%{transform:translate(4px,0);} 60%{transform:translate(-3px,0);} 80%{transform:translate(3px,0);} }
  .mine-cell .boom-particle{ position:absolute; inset:0; border-radius:14px; background:radial-gradient(circle, #fff6d0, #ff5b1a 50%, transparent 72%); opacity:0; }
  .mine-cell.revealed-bomb .boom-particle{ animation: boom .5s ease-out forwards; }
  .size-pick{ display:flex; gap:8px; margin-bottom:10px; }
  .size-pick button{ flex:1; padding:9px 0; border-radius:12px; border:1px solid var(--panel-brd); background:rgba(255,255,255,0.05); color:var(--text-1); font-weight:700; font-size:0.85rem; font-family:inherit; }
  .size-pick button.active{ background:linear-gradient(160deg, var(--ember-2), var(--ember-1)); color:#1a0d02; border-color:transparent; }
  .mine-count-row{ margin:10px 0 14px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:6px; border-radius:6px; background:rgba(255,255,255,0.1); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:linear-gradient(160deg, var(--ember-2), var(--ember-1)); box-shadow:0 0 10px rgba(255,122,26,0.7); cursor:pointer; }

  /* ===================== CASES ===================== */
  .case-select-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .case-card{ background:rgba(255,255,255,0.04); border:1px solid var(--panel-brd); border-radius:16px; padding:12px 6px; text-align:center; cursor:pointer; transition:transform .15s, border-color .15s; }
  .case-card:active{ transform:scale(0.94); }
  .case-card .ic{ font-size:2.1rem; display:block; margin-bottom:6px; filter:drop-shadow(0 6px 12px rgba(255,122,26,0.35)); }
  .case-card .nm{ font-size:0.78rem; font-weight:700; }
  .case-card .pr{ font-size:0.72rem; color:var(--text-1); margin-top:2px; }
  .case-detail{ display:none; }
  .case-detail.show{ display:block; }
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; cursor:pointer; color:var(--text-1); font-size:0.85rem; }
  .case-visual{ height:110px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .case-box{ font-size:4rem; filter: drop-shadow(0 8px 18px rgba(255,122,26,0.4)); transition: transform .25s; }
  .case-box.shake{ animation: caseShake .5s ease; }
  @keyframes caseShake{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-6deg);} 50%{transform:rotate(5deg);} 75%{transform:rotate(-3deg);} }
  .contents-row{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px; }
  .contents-row::-webkit-scrollbar{ display:none; }
  .content-chip{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px; background:rgba(255,255,255,0.04); border:1px solid var(--panel-brd); border-radius:12px; padding:8px 10px; min-width:58px; }
  .content-chip .ic{ font-size:1.2rem; }
  .content-chip .val{ font-size:0.68rem; font-weight:700; color:var(--text-1); }
  .reel-wrap{ position:relative; height:110px; overflow:hidden; border-radius:16px; border:1px solid var(--panel-brd); background:rgba(0,0,0,0.35); margin-bottom:14px; display:none; }
  .reel-marker{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:linear-gradient(180deg, var(--ember-2), var(--ember-1)); transform:translateX(-50%); z-index:3; box-shadow:0 0 12px rgba(255,150,40,0.8); }
  .reel-track{ position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; will-change:transform; }
  .reel-item{ width:104px; height:88px; margin:0 6px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; flex-shrink:0; border:1px solid var(--panel-brd); }
  .reel-item .ic{ font-size:1.8rem; }
  .reel-item .val{ font-size:0.78rem; font-weight:700; }
  .prize-banner{ text-align:center; padding:10px; border-radius:14px; margin-bottom:12px; font-weight:700; opacity:0; transform:translateY(6px); transition:all .3s; }
  .prize-banner.show{ opacity:1; transform:translateY(0); }

  /* ===================== UPGRADER ===================== */
  .wheel-stage{ position:relative; width:220px; height:220px; margin:4px auto 16px; }
  .wheel-pointer{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:1.5rem; z-index:6; color:var(--ember-2); filter:drop-shadow(0 0 8px rgba(255,150,40,0.9)); }
  .wheel-disc{ width:100%; height:100%; border-radius:50%; position:relative; border:7px solid rgba(255,255,255,0.06);
    box-shadow:0 0 0 1px var(--panel-brd), 0 12px 34px rgba(0,0,0,0.5), inset 0 0 26px rgba(0,0,0,0.45);
    transition: transform 3.6s cubic-bezier(.11,.82,.13,1); }
  .wheel-tick{ position:absolute; left:50%; top:50%; width:2px; height:50%; background:rgba(0,0,0,0.25); transform-origin:top center; }
  .wheel-center{ position:absolute; inset:0; margin:auto; width:70px; height:70px; border-radius:50%; background:var(--bg-1);
    border:1px solid var(--panel-brd); display:flex; align-items:center; justify-content:center; font-size:1.7rem; box-shadow:0 0 18px rgba(0,0,0,0.6); z-index:2; }
  .chance-dial{ text-align:center; margin:2px 0 10px; }
  .chance-dial b{ font-size:1.7rem; color:var(--ember-2); text-shadow:0 0 16px rgba(255,176,32,0.6); font-variant-numeric: tabular-nums; }
  .result-flash{ text-align:center; font-weight:800; font-size:1.1rem; padding:10px; border-radius:14px; margin-top:12px; opacity:0; transform:scale(0.9); transition:all .25s; }
  .result-flash.show{ opacity:1; transform:scale(1); }
  .result-flash.win{ background:rgba(63,185,106,0.18); color:var(--safe); }
  .result-flash.lose{ background:rgba(255,59,59,0.18); color:var(--danger); }

  /* ---------- bottom nav ---------- */
  #bottomnav{ position:relative; z-index:6; flex-shrink:0; margin:0 12px 12px; display:flex; gap:6px; padding:8px; border-radius:22px;
    background: var(--panel); border:1px solid var(--panel-brd);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 -6px 24px rgba(0,0,0,0.35); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px; border:none;
    border-radius:16px; color:var(--text-1); font-size:0.68rem; font-weight:600; transition: all .2s; position:relative;
    background:transparent; font-family:inherit; touch-action:manipulation; }
  .nav-btn .ic{ font-size:1.3rem; transition: transform .2s; }
  .nav-btn.active{ color:var(--ember-2); background:rgba(255,122,26,0.12); }
  .nav-btn.active .ic{ transform:translateY(-2px) scale(1.08); filter:drop-shadow(0 0 8px rgba(255,150,40,0.7)); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">
  <div class="ember-glow"></div>

  <div id="topbar">
    <div class="brand"><span class="flame">💎</span> АРТУР ГЕЙМ <span style="font-size:0.6rem; opacity:0.4; font-weight:400;">v3</span></div>
    <div class="balance"><span class="coin">💎</span><b id="balanceVal">1000</b></div>
  </div>

  <div id="ticker"><div id="ticker-track"></div></div>

  <div id="stage">
    <div id="viewport">

      <!-- ================= CRASH ================= -->
      <section class="view" id="view-crash">
        <h2 class="mode-title">🚀 Краш <span class="sub">забери виграш до вибуху</span></h2>
        <div class="card">
          <div class="crash-sky" id="crashSky">
            <div class="stars-bg"></div>
            <div class="crash-mult" id="crashMultLbl">1.00x</div>
            <div class="crash-status" id="crashStatus">очікування ставок…</div>
            <div class="rocket-wrap" id="rocketWrap">
              <div class="trail" id="trail"></div>
              <div class="flame" id="flameEl"></div>
              <svg class="rocket-svg" viewBox="0 0 64 64">
                <ellipse cx="32" cy="54" rx="10" ry="4" fill="#00000055"/>
                <path d="M32 4c9 9 12 22 12 32 0 6-2 11-4 14h-16c-2-3-4-8-4-14 0-10 3-23 12-32z" fill="url(#body)"/>
                <path d="M22 34c-6 2-10 8-10 16l10-4z" fill="#ff7a1a"/>
                <path d="M42 34c6 2 10 8 10 16l-10-4z" fill="#ff7a1a"/>
                <circle cx="32" cy="24" r="6" fill="#7fd3ff" stroke="#0a2233" stroke-width="1.5"/>
                <path d="M26 50h12l-2 6h-8z" fill="#c9ab8c"/>
                <defs>
                  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff3df"/>
                    <stop offset="60%" stop-color="#ffcf9a"/>
                    <stop offset="100%" stop-color="#ff7a1a"/>
                  </linearGradient>
                </defs>
              </svg>
              <div class="explosion" id="explosion"></div>
            </div>
          </div>

          <div class="row" style="margin-bottom:10px;">
            <div class="grow">
              <div style="font-size:0.72rem;color:var(--text-1);margin-bottom:4px;">Ставка</div>
              <input class="bet-input" id="crashBet" type="number" value="50" min="10" step="10">
            </div>
            <div class="stepper" style="align-self:flex-end;">
              <button type="button" onclick="crashAdjustBet(-10)">−10</button>
              <button type="button" onclick="crashAdjustBet(10)">+10</button>
            </div>
          </div>
          <button type="button" class="btn cashout-btn" id="crashBtn" onclick="crashAction()">
            Зробити ставку
            <span class="cash-amt" id="crashBtnSub">натисни ще раз, щоб забрати виграш під час польоту</span>
          </button>
        </div>
      </section>

      <!-- ================= MINES ================= -->
      <section class="view" id="view-mines">
        <h2 class="mode-title">💣 Міни <span class="sub">знайди зірки, оминай міни</span></h2>
        <div class="card">
          <div class="size-pick" id="sizePick">
            <button type="button" data-size="3" onclick="setGridSize(3)">3×3</button>
            <button type="button" data-size="5" class="active" onclick="setGridSize(5)">5×5</button>
            <button type="button" data-size="7" onclick="setGridSize(7)">7×7</button>
          </div>
          <div class="mine-count-row">
            <div class="row" style="justify-content:space-between; font-size:0.8rem; color:var(--text-1); margin-bottom:6px;">
              <span>Кількість мін</span><b id="mineCountLbl" style="color:var(--text-0);">3</b>
            </div>
            <input type="range" id="mineCountRange" min="1" max="10" value="3" oninput="onMineCountChange(this.value)">
          </div>
          <div class="row" style="margin-bottom:12px;">
            <div class="grow">
              <div style="font-size:0.72rem;color:var(--text-1);margin-bottom:4px;">Ставка</div>
              <input class="bet-input" id="minesBet" type="number" value="50" min="10" step="10">
            </div>
          </div>
          <div class="mines-grid" id="minesGrid"></div>
          <div class="row">
            <button type="button" class="btn grow" id="minesStartBtn" onclick="startMines()">Почати гру</button>
            <button type="button" class="btn ghost" id="minesCashBtn" onclick="cashoutMines()" style="display:none;">Забрати 💎<span id="minesCashVal"></span></button>
          </div>
        </div>
      </section>

      <!-- ================= CASES ================= -->
      <section class="view" id="view-cases">
        <h2 class="mode-title">📦 Кейси <span class="sub">обери кейс і відкрий</span></h2>
        <div class="card">

          <div id="caseSelectWrap">
            <div class="case-select-grid" id="caseSelectGrid"></div>
          </div>

          <div class="case-detail" id="caseDetail">
            <div class="back-row" onclick="backToCaseList()">‹ Обрати інший кейс</div>
            <div class="case-visual"><div class="case-box" id="caseBox"></div></div>
            <div class="contents-row" id="contentsRow"></div>
            <div class="reel-wrap" id="reelWrap">
              <div class="reel-marker"></div>
              <div class="reel-track" id="reelTrack"></div>
            </div>
            <div class="prize-banner" id="prizeBanner"></div>
            <button type="button" class="btn" style="width:100%;" id="openCaseBtn" onclick="openSelectedCase()"></button>
          </div>

        </div>
      </section>

      <!-- ================= UPGRADER ================= -->
      <section class="view" id="view-upgrade">
        <h2 class="mode-title">⚡ Апгрейдер <span class="sub">рулетка ризику</span></h2>
        <div class="card">
          <div class="chance-dial">Шанс на виграш<br><b id="chanceLbl">50%</b></div>

          <div class="wheel-stage">
            <div class="wheel-pointer">▼</div>
            <div class="wheel-disc" id="wheelDisc">
              <div class="wheel-center" id="wheelCenter">🎯</div>
            </div>
          </div>

          <div class="row wrap" style="margin-bottom:10px;">
            <div class="grow">
              <div style="font-size:0.72rem;color:var(--text-1);margin-bottom:4px;">Ставка (💎)</div>
              <input class="bet-input" id="upgBet" type="number" value="60" min="10" step="10" oninput="renderUpgradeInfo()">
            </div>
            <div class="grow">
              <div style="font-size:0.72rem;color:var(--text-1);margin-bottom:4px;">Множник</div>
              <input class="bet-input" id="upgMult" type="number" value="2" min="1.1" step="0.1" oninput="renderUpgradeInfo()">
            </div>
          </div>
          <div style="font-size:0.78rem;color:var(--text-1); margin-bottom:12px;" id="upgInfo"></div>
          <button type="button" class="btn" style="width:100%;" id="upgBtn" onclick="playUpgrade()">Апгрейднути</button>
          <div class="result-flash" id="upgResult"></div>
        </div>
      </section>

    </div>
  </div>

  <div id="bottomnav">
    <button type="button" class="nav-btn active" data-i="0"><span class="ic">🚀</span>Краш</button>
    <button type="button" class="nav-btn" data-i="1"><span class="ic">💣</span>Міни</button>
    <button type="button" class="nav-btn" data-i="2"><span class="ic">📦</span>Кейси</button>
    <button type="button" class="nav-btn" data-i="3"><span class="ic">⚡</span>Апгрейд</button>
  </div>
</div>

<script>
/* ===================== VIEWPORT HEIGHT FIX (mobile toolbars) ===================== */
function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px'); }
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);

/* ===================== STATE ===================== */
let balance = 1000;
const balEl = document.getElementById('balanceVal');
function setBalance(v, pulse){
  balance = Math.max(0, Math.round(v*100)/100);
  balEl.textContent = balance;
  if(pulse){
    balEl.classList.remove('pulse-up','pulse-down');
    void balEl.offsetWidth;
    balEl.classList.add(pulse>0?'pulse-up':'pulse-down');
  }
}
function flashBalance(delta){ setBalance(balance+delta, delta); }
function shakeEl(el){ el.style.animation='shake .4s'; setTimeout(()=>el.style.animation='',400); }

/* ===================== NAV / SWIPE ===================== */
const viewport = document.getElementById('viewport');
const navBtns = document.querySelectorAll('.nav-btn');
let current = 0;
function goTo(i){
  current = Math.max(0, Math.min(3, i));
  viewport.style.transform = `translateX(-${current*25}%)`;
  navBtns.forEach((b,idx)=>b.classList.toggle('active', idx===current));
}
navBtns.forEach(btn=>{
  btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.i,10)));
});
let touchStartX = null, touchStartY = null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3){ dx < 0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null; touchStartY = null;
}, {passive:true});

/* ===================== BOT TICKER ===================== */
const botNames = ["Оксана_К","Vlad92","Kittygirl","Andriy.M","xX_Sniper","Nastya777","MaxPower","Iryna_L","GG_Bohdan","Yuliia90","Sergio","LuckyPetro"];
const track = document.getElementById('ticker-track');
function spawnTick(){
  const name = botNames[Math.floor(Math.random()*botNames.length)];
  const win = Math.random() < 0.48;
  const bet = Math.floor(10 + Math.random()*180);
  const amt = win ? Math.floor(bet * (1.2 + Math.random()*3)) : bet;
  const modes = ["Краш","Міни","Кейси","Апгрейдер"];
  const mode = modes[Math.floor(Math.random()*modes.length)];
  const div = document.createElement('span');
  div.className = 'tick-item';
  div.innerHTML = `<b>${name}</b> · ${mode} · ставка ${bet}💎 · <span class="${win?'win':'loss'}">${win? '+'+amt+'💎' : '-'+amt+'💎'}</span>`;
  track.appendChild(div);
  if(track.children.length>18) track.removeChild(track.firstChild);
}
for(let i=0;i<8;i++) spawnTick();
setInterval(spawnTick, 2600);

/* ===================== CRASH ===================== */
let crashState = 'idle';
let crashMult = 1;
let crashRaf = null;
let crashPoint = 2;
let crashStart = 0;
const K_GROWTH = 0.07; // slower, steadier multiplier growth
const crashBtn = document.getElementById('crashBtn');
const crashMultLbl = document.getElementById('crashMultLbl');
const crashStatus = document.getElementById('crashStatus');
const rocketWrap = document.getElementById('rocketWrap');
const trailEl = document.getElementById('trail');
const flameEl = document.getElementById('flameEl');
const explosionEl = document.getElementById('explosion');

function crashAdjustBet(d){
  const inp = document.getElementById('crashBet');
  inp.value = Math.max(10, (parseInt(inp.value)||0) + d);
}
function rollCrashPoint(){
  const r = Math.random();
  if(r < 0.55) return 1 + Math.random()*0.8;
  if(r < 0.85) return 1.8 + Math.random()*2.2;
  if(r < 0.97) return 4 + Math.random()*6;
  return 10 + Math.random()*20;
}
function makeSub(t){ const s=document.createElement('span'); s.className='cash-amt'; s.id='crashBtnSub'; s.textContent=t; return s; }

function crashAction(){
  if(crashState==='idle'){
    const bet = parseFloat(document.getElementById('crashBet').value)||0;
    if(bet<=0 || bet>balance){ shakeEl(crashBtn); return; }
    flashBalance(-bet);
    crashState = 'flying';
    crashPoint = rollCrashPoint();
    crashMult = 1;
    crashStart = performance.now();
    rocketWrap.style.left='10%'; rocketWrap.style.bottom='8%'; rocketWrap.style.transform='rotate(-4deg)';
    trailEl.style.height='0px';
    explosionEl.classList.remove('go'); explosionEl.style.opacity=0;
    crashMultLbl.classList.remove('busted');
    crashStatus.textContent = 'летимо…';
    crashBtn.textContent = 'Забрати ';
    crashBtn.appendChild(makeSub('поточний виграш'));
    crashBtn.dataset.bet = bet;
    tickCrash();
  } else if(crashState==='flying'){
    cashoutCrash();
  }
}
function tickCrash(){
  const t = (performance.now()-crashStart)/1000;
  crashMult = Math.exp(K_GROWTH*t);
  if(crashMult >= crashPoint){ return doCrashBust(); }
  crashMultLbl.textContent = crashMult.toFixed(2)+'x';
  const bet = parseFloat(crashBtn.dataset.bet||0);
  const sub = document.getElementById('crashBtnSub');
  if(sub) sub.textContent = `${(bet*crashMult).toFixed(0)}💎 поточний виграш`;

  const left = 10 + 58*(1-Math.exp(-t*0.09));
  const bottom = 8 + 70*(1-Math.exp(-t*0.075)) + Math.sin(t*2)*0.6;
  const rot = -4 - 34*(1-Math.exp(-t*0.08)) + Math.sin(t*3)*1.4;
  const trailH = 22 + 66*(1-Math.exp(-t*0.1));
  const flameScale = 1 + Math.min(0.5, (crashMult-1)*0.06);

  rocketWrap.style.left = left + '%';
  rocketWrap.style.bottom = bottom + '%';
  rocketWrap.style.transform = `rotate(${rot}deg)`;
  trailEl.style.height = trailH+'px';
  flameEl.style.transform = `translateX(-50%) scale(${flameScale})`;

  crashRaf = requestAnimationFrame(tickCrash);
}
function cashoutCrash(){
  cancelAnimationFrame(crashRaf);
  const bet = parseFloat(crashBtn.dataset.bet||0);
  const win = bet*crashMult;
  flashBalance(win);
  crashStatus.textContent = `Забрано на ${crashMult.toFixed(2)}x! +${win.toFixed(0)}💎`;
  resetCrashUI();
}
function doCrashBust(){
  cancelAnimationFrame(crashRaf);
  crashMultLbl.textContent = crashPoint.toFixed(2)+'x';
  crashMultLbl.classList.add('busted');
  crashStatus.textContent = 'Вибух! 💥';
  explosionEl.style.left = rocketWrap.style.left;
  explosionEl.style.bottom = rocketWrap.style.bottom;
  explosionEl.getBoundingClientRect();
  explosionEl.style.opacity=1;
  explosionEl.classList.add('go');
  resetCrashUI();
}
function resetCrashUI(){
  crashState='idle';
  crashBtn.textContent='Зробити ставку';
  crashBtn.appendChild(makeSub('натисни ще раз, щоб забрати виграш під час польоту'));
  setTimeout(()=>{
    if(crashState==='idle'){
      crashMultLbl.textContent='1.00x'; crashMultLbl.classList.remove('busted');
      crashStatus.textContent='очікування ставок…';
      rocketWrap.style.left='10%'; rocketWrap.style.bottom='8%'; rocketWrap.style.transform='rotate(-4deg)';
      trailEl.style.height='0px'; explosionEl.classList.remove('go'); explosionEl.style.opacity=0;
    }
  }, 1600);
}

/* ===================== MINES ===================== */
let gridSize = 5;
let mineCount = 3;
let mineBoard = [];
let minesRevealed = 0;
let minesActive = false;
let minesBetAmt = 0;
const minesGridEl = document.getElementById('minesGrid');
const minesStartBtn = document.getElementById('minesStartBtn');
const minesCashBtn = document.getElementById('minesCashBtn');

function setGridSize(s){
  gridSize = s;
  document.querySelectorAll('#sizePick button').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.size)===s));
  const maxMines = s*s-1;
  document.getElementById('mineCountRange').max = Math.min(maxMines, s===3?7:s===5?20:40);
  if(mineCount > maxMines) { mineCount = Math.min(mineCount,maxMines); document.getElementById('mineCountRange').value=mineCount; document.getElementById('mineCountLbl').textContent=mineCount; }
  renderMinesGrid();
}
function onMineCountChange(v){ mineCount = parseInt(v); document.getElementById('mineCountLbl').textContent = mineCount; }
function renderMinesGrid(){
  minesGridEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
  minesGridEl.innerHTML = '';
  for(let i=0;i<gridSize*gridSize;i++){
    const c = document.createElement('div');
    c.className='mine-cell locked';
    c.dataset.i = i;
    c.innerHTML = `<span class="cell-ic"></span><span class="boom-particle"></span>`;
    c.onclick = ()=>revealCell(i);
    minesGridEl.appendChild(c);
  }
}
renderMinesGrid();

function startMines(){
  if(minesActive) return;
  minesBetAmt = parseFloat(document.getElementById('minesBet').value)||0;
  if(minesBetAmt<=0 || minesBetAmt>balance){ shakeEl(minesStartBtn); return; }
  flashBalance(-minesBetAmt);
  const total = gridSize*gridSize;
  mineBoard = new Array(total).fill(false);
  let placed = 0;
  while(placed < mineCount){
    const idx = Math.floor(Math.random()*total);
    if(!mineBoard[idx]){ mineBoard[idx]=true; placed++; }
  }
  minesRevealed = 0;
  minesActive = true;
  renderMinesGrid();
  document.querySelectorAll('.mine-cell').forEach(c=>c.classList.remove('locked'));
  minesStartBtn.style.display='none';
  minesCashBtn.style.display='inline-block';
  updateMinesCashValue();
}
function currentMinesMultiplier(){
  const total = gridSize*gridSize;
  let mult = 1;
  for(let k=0;k<minesRevealed;k++){
    mult *= (total-k) / (total-k-mineCount);
  }
  return mult;
}
function updateMinesCashValue(){
  const mult = currentMinesMultiplier();
  document.getElementById('minesCashVal').textContent = (minesBetAmt*mult).toFixed(0);
}
function revealCell(i){
  if(!minesActive) return;
  const cell = minesGridEl.children[i];
  if(cell.classList.contains('revealed-safe')||cell.classList.contains('revealed-bomb')) return;
  if(mineBoard[i]){
    cell.classList.add('revealed-bomb');
    cell.querySelector('.cell-ic').textContent='💥';
    document.querySelectorAll('.mine-cell').forEach(c=>c.classList.add('locked'));
    minesActive = false;
    minesStartBtn.style.display='inline-block';
    minesCashBtn.style.display='none';
    revealAllMines();
    setBalance(balance,-1);
  } else {
    cell.classList.add('revealed-safe');
    cell.querySelector('.cell-ic').textContent='🔱';
    minesRevealed++;
    updateMinesCashValue();
    if(minesRevealed === gridSize*gridSize - mineCount){
      cashoutMines();
    }
  }
}
function revealAllMines(){
  mineBoard.forEach((isMine, i)=>{
    const cell = minesGridEl.children[i];
    if(isMine){
      if(!cell.classList.contains('revealed-bomb')){ cell.classList.add('revealed-bomb'); cell.querySelector('.cell-ic').textContent='💥'; }
    } else if(!cell.classList.contains('revealed-safe')){
      cell.querySelector('.cell-ic').textContent='🔱'; cell.style.opacity='0.5';
    }
  });
}
function cashoutMines(){
  if(!minesActive && minesRevealed===0) return;
  const mult = currentMinesMultiplier();
  const win = minesBetAmt*mult;
  flashBalance(win);
  minesActive = false;
  minesStartBtn.style.display='inline-block';
  minesCashBtn.style.display='none';
  revealAllMines();
  document.querySelectorAll('.mine-cell').forEach(c=>c.classList.add('locked'));
}

/* ===================== CASES ===================== */
const CASES_CONFIG = [
  { id:'basic', name:'Простий', icon:'📦', price:25,
    pool:[
      {name:'Дрібняк', val:8, ic:'🥉', weight:45, color:'#8a7a63'},
      {name:'Кристал', val:20, ic:'💎', weight:30, color:'#5bc0ff'},
      {name:'Зоря', val:45, ic:'⭐', weight:18, color:'#ffb020'},
      {name:'Корона', val:90, ic:'👑', weight:6, color:'#ff7a1a'},
      {name:'Джекпот', val:200, ic:'🏆', weight:1, color:'#ff3d1a'},
    ]},
  { id:'premium', name:'Преміум', icon:'🎁', price:75,
    pool:[
      {name:'Дрібняк', val:20, ic:'🥉', weight:38, color:'#8a7a63'},
      {name:'Кристал', val:60, ic:'💎', weight:28, color:'#5bc0ff'},
      {name:'Зоря', val:140, ic:'⭐', weight:20, color:'#ffb020'},
      {name:'Корона', val:320, ic:'👑', weight:10, color:'#ff7a1a'},
      {name:'Джекпот', val:900, ic:'🏆', weight:4, color:'#ff3d1a'},
    ]},
  { id:'legend', name:'Легендарний', icon:'🔥', price:200,
    pool:[
      {name:'Дрібняк', val:60, ic:'🥉', weight:35, color:'#8a7a63'},
      {name:'Кристал', val:180, ic:'💎', weight:27, color:'#5bc0ff'},
      {name:'Зоря', val:420, ic:'⭐', weight:20, color:'#ffb020'},
      {name:'Корона', val:900, ic:'👑', weight:12, color:'#ff7a1a'},
      {name:'Джекпот', val:2500, ic:'🏆', weight:6, color:'#ff3d1a'},
    ]},
];
let currentCase = null;
let caseOpening = false;

const caseSelectGrid = document.getElementById('caseSelectGrid');
const caseSelectWrap = document.getElementById('caseSelectWrap');
const caseDetail = document.getElementById('caseDetail');
const caseBox = document.getElementById('caseBox');
const contentsRow = document.getElementById('contentsRow');
const reelWrap = document.getElementById('reelWrap');
const reelTrack = document.getElementById('reelTrack');
const prizeBanner = document.getElementById('prizeBanner');
const openCaseBtn = document.getElementById('openCaseBtn');

function renderCaseSelect(){
  caseSelectGrid.innerHTML = '';
  CASES_CONFIG.forEach(cfg=>{
    const el = document.createElement('div');
    el.className='case-card';
    el.innerHTML = `<span class="ic">${cfg.icon}</span><span class="nm">${cfg.name}</span><span class="pr">${cfg.price}💎</span>`;
    el.onclick = ()=>selectCase(cfg.id);
    caseSelectGrid.appendChild(el);
  });
}
renderCaseSelect();

function selectCase(id){
  currentCase = CASES_CONFIG.find(c=>c.id===id);
  caseSelectWrap.style.display='none';
  caseDetail.classList.add('show');
  caseBox.textContent = currentCase.icon;
  caseBox.classList.remove('shake');
  reelWrap.style.display='none';
  prizeBanner.classList.remove('show');
  prizeBanner.textContent='';
  contentsRow.innerHTML='';
  currentCase.pool.forEach(p=>{
    const chip = document.createElement('div');
    chip.className='content-chip';
    chip.style.borderColor = p.color+'55';
    chip.innerHTML = `<span class="ic">${p.ic}</span><span class="val" style="color:${p.color}">${p.val}💎</span>`;
    contentsRow.appendChild(chip);
  });
  openCaseBtn.textContent = `Відкрити за ${currentCase.price}💎`;
  openCaseBtn.disabled = false;
}
function backToCaseList(){
  caseDetail.classList.remove('show');
  caseSelectWrap.style.display='block';
  currentCase = null;
}
function weightedPick(pool){
  const total = pool.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(const p of pool){ if(r<p.weight) return p; r-=p.weight; }
  return pool[0];
}
function openSelectedCase(){
  if(caseOpening || !currentCase) return;
  if(balance < currentCase.price){ shakeEl(openCaseBtn); return; }
  flashBalance(-currentCase.price);
  caseOpening = true;
  openCaseBtn.disabled = true;
  prizeBanner.classList.remove('show');
  caseBox.classList.add('shake');
  const winner = weightedPick(currentCase.pool);
  const items = [];
  for(let i=0;i<28;i++) items.push(currentCase.pool[Math.floor(Math.random()*currentCase.pool.length)]);
  const winnerIndex = 24;
  items[winnerIndex] = winner;
  reelTrack.innerHTML = '';
  items.forEach(p=>{
    const el = document.createElement('div');
    el.className='reel-item';
    el.style.background = 'rgba(255,255,255,0.04)';
    el.style.borderColor = p.color+'55';
    el.innerHTML = `<span class="ic">${p.ic}</span><span class="val" style="color:${p.color}">${p.val}💎</span>`;
    reelTrack.appendChild(el);
  });
  setTimeout(()=>{
    reelWrap.style.display='block';
    const itemW = 116;
    const wrapW = reelWrap.clientWidth;
    const targetX = winnerIndex*itemW + itemW/2 - wrapW/2 + (Math.random()*30-15);
    reelTrack.style.transition='none';
    reelTrack.style.transform = 'translateX(0px)';
    void reelTrack.offsetWidth;
    reelTrack.style.transition = 'transform 3.2s cubic-bezier(.12,.7,.1,1)';
    reelTrack.style.transform = `translateX(${-targetX}px)`;
    setTimeout(()=>{
      caseBox.classList.remove('shake');
      flashBalance(winner.val);
      prizeBanner.textContent = `Випало: ${winner.ic} ${winner.name} — +${winner.val}💎`;
      prizeBanner.style.background = winner.color+'22';
      prizeBanner.style.color = winner.color;
      prizeBanner.classList.add('show');
      caseOpening = false;
      openCaseBtn.disabled = false;
    }, 3300);
  }, 50);
}

/* ===================== UPGRADER ===================== */
const upgBetEl = document.getElementById('upgBet');
const upgMultEl = document.getElementById('upgMult');
const upgInfo = document.getElementById('upgInfo');
const chanceLbl = document.getElementById('chanceLbl');
const upgResult = document.getElementById('upgResult');
const upgBtn = document.getElementById('upgBtn');
const wheelDisc = document.getElementById('wheelDisc');
const wheelCenter = document.getElementById('wheelCenter');
let upgrading = false;
let wheelRotation = 0;

function computeChance(){
  const mult = parseFloat(upgMultEl.value)||2;
  let chance = (1/mult) * 0.94;
  return Math.max(0.03, Math.min(0.95, chance));
}
function paintWheel(chance){
  const deg = chance*360;
  wheelDisc.style.background = `conic-gradient(var(--safe) 0deg ${deg}deg, var(--danger) ${deg}deg 360deg)`;
}
function renderUpgradeInfo(){
  const bet = parseFloat(upgBetEl.value)||0;
  const mult = parseFloat(upgMultEl.value)||2;
  const chance = computeChance();
  chanceLbl.textContent = Math.round(chance*100)+'%';
  paintWheel(chance);
  upgInfo.textContent = `Ставка ${bet}💎 → при виграші отримаєш ${(bet*mult).toFixed(0)}💎 (шанс ${Math.round(chance*100)}%)`;
}
renderUpgradeInfo();

function playUpgrade(){
  if(upgrading) return;
  const bet = parseFloat(upgBetEl.value)||0;
  const mult = parseFloat(upgMultEl.value)||2;
  if(bet<=0 || bet>balance){ shakeEl(upgBtn); return; }
  upgrading = true;
  upgBtn.disabled = true;
  upgResult.classList.remove('show','win','lose');
  wheelCenter.textContent = '🎲';
  flashBalance(-bet);

  const chance = computeChance();
  const winDeg = chance*360;
  const win = Math.random() < chance;
  const theta = win ? Math.random()*winDeg*0.94 + winDeg*0.03 : winDeg + Math.random()*(360-winDeg)*0.94 + (360-winDeg)*0.03;

  const base = Math.ceil((wheelRotation+1)/360)*360;
  const extraSpins = 4*360;
  const target = base + extraSpins + ((360-theta)%360);
  wheelRotation = target;
  wheelDisc.style.transform = `rotate(${target}deg)`;

  setTimeout(()=>{
    if(win){
      const winAmt = bet*mult;
      flashBalance(winAmt);
      wheelCenter.textContent = '✅';
      upgResult.textContent = `✅ Виграш! +${winAmt.toFixed(0)}💎`;
      upgResult.classList.add('show','win');
    } else {
      wheelCenter.textContent = '❌';
      upgResult.textContent = `❌ Програш. -${bet.toFixed(0)}💎`;
      upgResult.classList.add('show','lose');
    }
    upgrading = false;
    upgBtn.disabled = false;
  }, 3650);
}

/* init */
setBalance(1000,0);
goTo(0);
</script>
